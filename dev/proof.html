<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Proof sheet</title>
  </head>
  <body style="margin:0;background:#888">
    <p id="status" style="font:14px monospace;padding:8px">rendering…</p>
    <script type="module">
      import '@fontsource/im-fell-english/400.css';
      import '@fontsource/im-fell-english/400-italic.css';
      import '@fontsource/im-fell-english-sc/400.css';
      import '@fontsource/ibm-plex-mono/400.css';
      import { renderPoster } from '../src/render/poster';
      import { buildSpecFromState } from '../src/spec';
      import { readState } from '../src/ui/state';

      // Synthetic fixtures: a spread of latitudes, seasons, day/night and themes.
      const FIXTURES = {
        greenwich: '',
        sydney: 'd=1987-02-24&t=04:00&lat=-33.8688&lon=151.2093&p=Sydney, Australia&c=For Mira, who arrived early&th=archive',
        reykjavik: 'd=2003-12-21&t=17:45&lat=64.1466&lon=-21.9426&p=Reykjavík, Iceland&c=The longest night&th=nocturne',
        quito: 'd=2015-06-03&t=21:10&lat=-0.1807&lon=-78.4678&p=Quito, Ecuador&c=Where we met&th=observatory',
        noon: 'd=2020-12-21&t=12:00&lat=40.7128&lon=-74.006&p=New York&c=Born at noon&th=observatory',
        conj: 'd=2020-12-21&t=17:15&lat=51.4769&lon=-0.0005&p=Greenwich&c=The Great Conjunction&th=archive',
      };
      await Promise.all(['20px "IM Fell English"', 'italic 20px "IM Fell English"', '20px "IM Fell English SC"', '20px "IBM Plex Mono"'].map((f) => document.fonts.load(f)));
      const q = new URLSearchParams(location.search);
      const width = Number(q.get('w') ?? 1754);
      const names = (q.get('f') ?? Object.keys(FIXTURES).join(',')).split(',');
      const log = [];
      for (const n of names) {
        const t0 = performance.now();
        const c = renderPoster(buildSpecFromState(readState('#' + FIXTURES[n])), width);
        const ms = Math.round(performance.now() - t0);
        const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
        await fetch(`/__proof?name=${n}-${width}`, { method: 'POST', body: blob });
        log.push(`${n}: ${c.width}×${c.height} in ${ms}ms, ${Math.round(blob.size / 1024)} KB`);
      }
      document.getElementById('status').textContent = log.join(' | ');
      window.__done = log;
    </script>
  </body>
</html>
